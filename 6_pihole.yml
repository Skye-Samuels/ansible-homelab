---
- name: "Layer 6: Deploy Pi-hole"
  hosts: all
  become: true

  tasks:
    - name: Create Pi-hole configuration directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/pihole/etc-pihole
        - /opt/pihole/etc-dnsmasq.d

    - name: Deploy Pi-hole Container
      docker_container:
        name: pihole
        image: pihole/pihole:latest
        restart_policy: unless-stopped
        env:
          TZ: "{{ timezone }}"
          FTLCONF_webserver_api_password: "{{ pihole_password }}"
          FTLCONF_dns_listeningMode: "all"
        ports:
          - "127.0.0.1:53:53/tcp"
          - "127.0.0.1:53:53/udp"
          - "127.0.0.1:{{ pihole_web_port }}:80/tcp"
        volumes:
          - "/opt/pihole/etc-pihole:/etc/pihole"
          - "/opt/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"
      no_log: true

    - name: Wait for Pi-hole Web UI to be ready
      uri:
        url: "http://127.0.0.1:{{ pihole_web_port }}/admin/"
        status_code: 200
      register: pihole_ui_check
      until: pihole_ui_check.status == 200
      retries: 10
      delay: 5

    - name: Verify Pi-hole DNS resolution (local)
      command: "dig @127.0.0.1 -p 53 google.com +short"
      register: dns_check
      changed_when: false
      until: dns_check.stdout != ""
      retries: 5
      delay: 2

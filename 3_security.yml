---
- name: "Layer 3: Security Hardening"
  hosts: all
  become: true

  tasks:
    - name: Install security packages
      apt:
        name:
          - ufw
          - fail2ban
        state: present

    - name: Deploy hardened sshd_config
      template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"
      notify: restart ssh

    - name: Deploy fail2ban jail configuration
      template:
        src: templates/jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: restart fail2ban

    - name: Allow SSH through UFW
      ufw:
        rule: allow
        name: OpenSSH

    - name: Enable UFW and set default deny policy
      ufw:
        state: enabled
        policy: deny
        direction: incoming

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

    - name: restart fail2ban
      service:
        name: fail2ban
        state: restarted

---
- name: "Layer 9: Deploy Jellyfin Stack via Compose"
  hosts: all
  become: true

  tasks:
    - name: Notify that Jellyfin Stack is disabled
      debug:
        msg: "Skipping Layer 9: Jellyfin Stack is disabled in vars.yml"
      when: not (enable_jellyfin_stack | default(true) | bool)

    - name: Check if Jellyfin Stack is enabled
      meta: end_play
      when: not (enable_jellyfin_stack | default(true) | bool)

    - name: Ensure directory structure exists
      file:
        path: "{{ item }}"
        state: directory
        owner: sysadmin
        group: sysadmin
        mode: '0775'
      loop:
        - "{{ docker_config_path }}/jellyfin-stack"
        - "{{ docker_config_path }}/gluetun"
        - "{{ docker_config_path }}/qbittorrent"
        - "{{ docker_config_path }}/prowlarr"
        - "{{ docker_config_path }}/radarr"
        - "{{ docker_config_path }}/sonarr"
        - "{{ docker_config_path }}/jellyfin"
        - "{{ docker_config_path }}/jellyseerr"
        - "{{ docker_config_path }}/wizarr"
        - "{{ docker_config_path }}/newtarr"
        - "{{ docker_config_path }}/bazarr"
        - "{{ base_storage_path }}"
        - "{{ base_storage_path }}/downloads"
        - "{{ base_storage_path }}/media/movies"
        - "{{ base_storage_path }}/media/shows"

    - name: Deploy Docker Compose Template
      template:
        src: templates/jellyfin_stack.yml.j2
        dest: "{{ docker_config_path }}/jellyfin-stack/docker-compose.yml"
        owner: sysadmin
        group: sysadmin
        mode: '0644'

    - name: Pull and Start Jellyfin Stack
      community.docker.docker_compose_v2:
        project_src: "{{ docker_config_path }}/jellyfin-stack"
        state: present
        pull: always
        remove_orphans: true

    - name: Verify Container Status
      shell: "docker compose ps"
      args:
        chdir: "{{ docker_config_path }}/jellyfin-stack"
      register: compose_status
      changed_when: false

    - name: Show Container Status
      debug:
        var: compose_status.stdout_lines

    - name: Wait for Jellyfin to be ready
      uri:
        url: "http://127.0.0.1:{{ jellyfin_port }}"
        status_code: [200, 302]
      register: jellyfin_check
      until: jellyfin_check.status in [200, 302]
      retries: 20
      delay: 5

    - name: Wait for qBitTorrent WebUI to be ready
      uri:
        url: "http://127.0.0.1:{{ qbittorrent_webui_port }}"
        status_code: 200
      register: qbit_check
      until: qbit_check.status == 200
      retries: 20
      delay: 5

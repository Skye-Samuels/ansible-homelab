---
# ==============================================================================
# MAIN HOMELAB DEPLOYMENT PLAYBOOK
# ==============================================================================
# This playbook orchestrates the entire stack. You can run individual layers
# using tags (e.g., --tags storage).
# ==============================================================================
- name: "Deploy Homelab Stack"
  hosts: all
  become: true

  roles:
    - role: storage
      tags: storage

    - role: base
      tags: base

    - role: networking
      tags: networking

    - role: security
      tags: security

    - role: docker
      tags: docker

    - role: caddy
      tags: caddy

    - role: pihole
      tags: pihole

    - role: nextcloud
      tags: nextcloud

    - role: mealie
      tags: mealie

    - role: jellyfin
      tags: jellyfin

  post_tasks:
    - name: Deploy Master Docker Compose Orchestrator
      ansible.builtin.template:
        src: roles/docker/templates/master-compose.yml.j2
        dest: "{{ docker_config_path }}/docker-compose.yml"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: '0644'
      tags: always

    - name: Verify Entire Stack Status
      ansible.builtin.shell: "docker compose ps --format '{% raw %}table {{.Name}}\t{{.Status}}\t{{.Ports}}{% endraw %}'"
      args:
        chdir: "{{ docker_config_path }}"
      register: global_status
      changed_when: false
      tags: always

    - name: Show Global Stack Status
      ansible.builtin.debug:
        msg: "{{ global_status.stdout }}"
      tags: always

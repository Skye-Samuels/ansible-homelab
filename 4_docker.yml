---
- name: "Layer 4: Install Docker and LazyDocker"
  hosts: all
  become: true

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Create directory for Docker GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG apt Key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        state: present

    - name: Add LazyDocker GPG key
      get_url:
        url: https://debian.griffo.io/EA0F721D231FDD3A0A17B9AC7808B4DD62C41256.asc
        dest: /tmp/lazydocker.asc

    - name: Dearmor LazyDocker GPG key
      shell: gpg --dearmor --yes -o /etc/apt/trusted.gpg.d/debian.griffo.io.gpg /tmp/lazydocker.asc
      args:
        creates: /etc/apt/trusted.gpg.d/debian.griffo.io.gpg

    - name: Add LazyDocker Repository
      apt_repository:
        repo: "deb https://debian.griffo.io/apt bookworm main"
        filename: debian.griffo.io
        state: present

    - name: Install Docker Engine, Compose, and LazyDocker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - lazydocker
        update_cache: yes
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add sysadmin user to docker group
      user:
        name: sysadmin
        groups: docker
        append: yes

    - name: Verify Docker is responding
      command: docker info
      changed_when: false
      register: docker_info
      failed_when: docker_info.rc != 0

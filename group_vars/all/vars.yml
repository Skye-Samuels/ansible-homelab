###############################################################################
# SYSTEM IDENTITY & NETWORK
###############################################################################
hostname_desired: "homelab"
timezone: "America/Los_Angeles" # CHANGE TO YOUR TIMEZONE (e.g., UTC)
domain: "homelab.local"         # CHANGE TO YOUR DOMAIN NAME
admin_user: "sysadmin"          # The primary user account on the server

# DNS settings for the system (Used before Pi-hole is up)
dns_servers:
  - "10.0.0.245"
  - "1.1.1.1"

###############################################################################
# APPLICATION FEATURE FLAGS
# Set to 'true' to deploy, 'false' to skip or stop the service
###############################################################################
enable_nextcloud: true
enable_mealie: true
enable_jellyfin_stack: true

###############################################################################
# SUBDOMAINS
# Used by Caddy for reverse proxy routing (e.g., cloud.example.com)
###############################################################################
nextcloud_subdomain: "cloud"
mealie_subdomain: "mealie"
jellyfin_subdomain: "jellyfin"
jellyseerr_subdomain: "request"
wizarr_subdomain: "join"

###############################################################################
# DOCKER & USER CONFIG
###############################################################################
puid: 1000 # User ID for file ownership inside containers
pgid: 1000 # Group ID for file ownership inside containers
docker_project_name: "homelab"
docker_config_path: "/home/{{ admin_user }}/docker_configs"

###############################################################################
# STORAGE CONFIGURATIONS
# CAUTION: 'format_disks: true' will WIPE the disks below on first run.
###############################################################################
storage_root: "/storage"
base_storage_path: "{{ storage_root }}/jellyfin/data"
format_disks: true            # Set to false after first successful run

storage_disks:  # CHANGE TO YOUR DRIVE(S)
  - { name: "disk1", path: "/dev/sdb" }
  - { name: "disk2", path: "/dev/sdc" }
  - { name: "disk3", path: "/dev/sdd" }

###############################################################################
# SERVICE CONFIGURATIONS (Ports & VPN)
###############################################################################
vpn_region: "CA Vancouver" # For Gluetun/PIA VPN connection
pihole_web_port: 8080
nextcloud_web_port: 8081
mealie_web_port: 9000
qbittorrent_webui_port: 8082
jellyfin_port: 8096
jellyseerr_port: 5055
prowlarr_port: 9696
radarr_port: 7878
sonarr_port: 8989
wizarr_port: 5690
newtarr_port: 9705
bazarr_port: 6767

###############################################################################
# VAULT SECRETS
# These must be defined in your encrypted group_vars/all/vault.yml
###############################################################################
pihole_password: "{{ vault_pihole_password | mandatory('Set vault_pihole_password in your vault file.') }}"
pia_user: "{{ vault_pia_user | mandatory('Set vault_pia_user in your vault file.') }}"
pia_pass: "{{ vault_pia_pass | mandatory('Set vault_pia_pass in your vault file.') }}"

---
- name: Ensure directory structure exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: '0775'
  loop:
    - "{{ docker_config_path }}/jellyfin-stack"
    - "{{ docker_config_path }}/gluetun"
    - "{{ docker_config_path }}/qbittorrent"
    - "{{ docker_config_path }}/prowlarr"
    - "{{ docker_config_path }}/radarr"
    - "{{ docker_config_path }}/sonarr"
    - "{{ docker_config_path }}/jellyfin"
    - "{{ docker_config_path }}/jellyseerr"
    - "{{ docker_config_path }}/wizarr"
    - "{{ docker_config_path }}/newtarr"
    - "{{ docker_config_path }}/bazarr"
    - "{{ base_storage_path }}"
    - "{{ base_storage_path }}/downloads"
    - "{{ base_storage_path }}/media/movies"
    - "{{ base_storage_path }}/media/shows"

- name: Deploy Docker Compose Template
  ansible.builtin.template:
    src: jellyfin_stack.yml.j2
    dest: "{{ docker_config_path }}/jellyfin-stack/docker-compose.yml"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: '0644'

- name: Pull and Start Jellyfin Stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_config_path }}/jellyfin-stack"
    files: ["docker-compose.yml"]
    project_name: "{{ docker_project_name }}"
    state: present
    pull: always
  environment:
    COMPOSE_IGNORE_ORPHANS: "true"
  register: jellyfin_pull
  until: jellyfin_pull is not failed
  retries: 5
  delay: 10

- name: Wait for Jellyfin to be ready
  ansible.builtin.command: docker exec jellyfin curl -sf http://localhost:8096
  register: jellyfin_check
  until: jellyfin_check.rc == 0
  retries: 20
  delay: 5
  changed_when: false

- name: Wait for qBitTorrent WebUI to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qbittorrent_webui_port }}"
    status_code: 200
  register: qbit_check
  until: qbit_check.status == 200
  retries: 20
  delay: 5

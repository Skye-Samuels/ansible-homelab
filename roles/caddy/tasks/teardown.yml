---
- name: Check if Caddy directory exists
  ansible.builtin.stat:
    path: "{{ docker_config_path }}/caddy"
  register: caddy_dir

- name: Tear down Caddy Stack
  community.docker.docker_compose_v2:
    project_src: "{{ docker_config_path }}/caddy"
    files: ["docker-compose.yml"]
    project_name: "{{ docker_project_name }}"
    state: absent
  environment:
    COMPOSE_IGNORE_ORPHANS: "true"
  when: caddy_dir.stat.exists

- name: Remove UFW rules for Caddy
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: "{{ 'udp' if item == '443' else 'tcp' }}"
    state: absent
  loop:
    - "80"
    - "443"

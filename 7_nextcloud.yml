---
- name: "Layer 7: Deploy Nextcloud AIO"
  hosts: all
  become: true

  tasks:
    - name: Create Nextcloud storage directory
      file:
        path: "{{ storage_root }}/nextcloud"
        state: directory
        owner: sysadmin
        group: sysadmin
        mode: '0775'

    - name: Create the required AIO named volume
      docker_volume:
        name: nextcloud_aio_mastercontainer
        state: present

    - name: Deploy Nextcloud AIO
      docker_container:
        name: nextcloud-aio-mastercontainer
        image: nextcloud/all-in-one:latest
        state: started
        restart_policy: always
        ports:
          - "127.0.0.1:{{ nextcloud_web_port }}:8080"
        networks:
          - name: caddy_net
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - nextcloud_aio_mastercontainer:/mnt/docker-aio-config
          - "{{ storage_root }}/nextcloud:/mnt/ncdata"
        env:
          NEXTCLOUD_DATADIR: "/mnt/ncdata"
          APACHE_PORT: "11000"
          APACHE_IP_BINDING: "0.0.0.0"
          NEXTCLOUD_MOUNT: "{{ storage_root }}/nextcloud"
          SKIP_DOMAIN_VALIDATION: "true"
          AIO_NETWORK: "caddy_net"
        labels:
          caddy: cloud.homelab.local
          caddy.reverse_proxy: "nextcloud-aio-apache:11000"

    - name: Wait for Nextcloud AIO to be ready
      uri:
        url: "https://127.0.0.1:{{ nextcloud_web_port }}/"
        status_code: [200, 302]
        validate_certs: no
      register: ncaio_check
      until: ncaio_check.status in [200, 302]
      retries: 20
      delay: 5

    - name: Ensure Apache is connected to caddy_net
      community.docker.docker_network:
        name: caddy_net
        connected:
          - nextcloud-aio-apache
        appends: yes
      register: network_result
      until: network_result is not failed
      retries: 40
      delay: 5
